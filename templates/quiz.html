<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before you continue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap" style="max-width: 560px;">
  <header class="masthead">
    <h1 style="font-size:28px;">Before you continue</h1>
    <p class="subhead">Please answer the following before entering the risk assessment tool.</p>
  </header>

  {% if error %}
  <div class="panel notice notice--error">{{ error }}</div>
  {% endif %}

  <form class="panel form" method="POST">
    {% for q in questions %}
    <div class="field" style="margin-bottom:18px;">
      <span>{{ q.question }}</span>
      <input type="text" name="{{ q.id }}" required>
    </div>
    {% endfor %}
    <button type="submit" class="submit-btn">Continue</button>
  </form>
</div>
</body>
</html>
