<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap" style="max-width: 420px; padding-top: 100px;">
  <header class="masthead">
    <h1 style="font-size:28px;">Sign in</h1>
    <p class="subhead">Enter your username and password to access the risk assessment tool.</p>
  </header>

  {% if error %}
  <div class="panel notice notice--error">{{ error }}</div>
  {% endif %}

  <form class="panel form" method="POST">
    <div class="field" style="margin-bottom:16px;">
      <span>Username</span>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="field" style="margin-bottom:16px;">
      <span>Password</span>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="submit-btn">Sign in</button>
  </form>
</div>
</body>
</html>
